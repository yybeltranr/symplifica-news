spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: symplifica-news

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/symplifica_news}
    username: ${DB_USERNAME:symplifica_app}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model-name: ${OLLAMA_MODEL:gemma3:4b}
    temperature: 0.2
    timeout: PT120S
  news:
    recipients: ${NEWS_EMAIL_TO}
    rss-url: https://www.portafolio.co/rss/tendencias/entretenimiento.xml
    subject: Resumen de noticias de entretenimiento
    job-cron: ${NEWS_JOB_CRON:0 * * * *}

jobrunr:
  job-scheduler:
    enabled: true

  background-job-server:
    enabled: true

  dashboard:
    enabled: true
    port: 8000

logging:
  level:
    '[org.jobrunr.server]': INFO

