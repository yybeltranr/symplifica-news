spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: symplifica-news

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/symplifica_news}
    username: ${DB_USERNAME:symplifica_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

app:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model-name: ${OLLAMA_MODEL:gemma3:4b}
    temperature: 0.2
    timeout: PT120S
  news:
    recipients: ${NEWS_EMAIL_TO}
    rss-url: http://portafolio.co/rss/tendencias/entretenimiento.xml
    subject: Resumen diario de noticias de entretenimiento
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
